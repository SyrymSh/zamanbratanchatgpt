<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaman Bank AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.8;
            font-size: 0.9em;
        }

        .chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .user .message-bubble {
            background: #007bff;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 0.9em;
        }

        .input-field:focus {
            border-color: #007bff;
        }

        .voice-btn, .send-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #007bff;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .voice-btn:hover, .send-btn:hover {
            background: #0056b3;
        }

        .voice-btn.recording {
            background: #dc3545;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .expense-analysis {
            background: #e8f5e8;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 0.85em;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 8px 12px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 15px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-btn:hover {
            background: #007bff;
            color: white;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Zaman Bank AI Assistant</h1>
            <p>Ваш персональный финансовый помощник</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-bubble">
                    Привет! Я ваш AI-помощник из банка Zaman. 🤗<br><br>
                    Я могу помочь вам с:
                    • Финансовыми целями<br>
                    • Анализом расходов<br>
                    • Подбором продуктов<br>
                    • Советами по сбережениям<br><br>
                    Чем могу помочь?
                </div>
            </div>
        </div>

        <div class="input-container">
            <input type="text" class="input-field" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
            <button class="voice-btn" id="voiceBtn" title="Голосовой ввод">
                🎤
            </button>
            <button class="send-btn" id="sendBtn" title="Отправить">
                ➤
            </button>
        </div>

        <div class="quick-actions" id="quickActions">
            <button class="quick-btn" onclick="sendQuickMessage('Проанализируй мои расходы')">Анализ расходов</button>
            <button class="quick-btn" onclick="sendQuickMessage('Помоги с финансовыми целями')">Финансовые цели</button>
            <button class="quick-btn" onclick="sendQuickMessage('Какие продукты мне подходят?')">Подбор продуктов</button>
            <button class="quick-btn" onclick="sendQuickMessage('Советы по сбережениям')">Советы</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const quickActions = document.getElementById('quickActions');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // Отправка сообщения
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            messageInput.value = '';
            showTypingIndicator();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                hideTypingIndicator();

                if (data.expense_analysis) {
                    showExpenseAnalysis(data.expense_analysis);
                }

                addMessage(data.response, 'bot');
            } catch (error) {
                hideTypingIndicator();
                addMessage('Извините, произошла ошибка. Пожалуйста, попробуйте еще раз.', 'bot');
            }
        }

        // Голосовой ввод
        voiceBtn.addEventListener('click', async function() {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        });

        async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                sampleRate: 16000,
                channelCount: 1,
                echoCancellation: true
            }
        });
        mediaRecorder = new MediaRecorder(stream, {
            mimeType: 'audio/webm;codecs=opus'
        });
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            await sendVoiceMessage(audioBlob);
        };

        mediaRecorder.start(1000); // Записываем chunks каждую секунду
        isRecording = true;
        voiceBtn.classList.add('recording');
        voiceBtn.innerHTML = '⏹️';
    } catch (error) {
        console.error('Error accessing microphone:', error);
        addMessage('Не удалось получить доступ к микрофону. Проверьте разрешения.', 'bot');
    }
}

async function sendVoiceMessage(audioBlob) {
    showTypingIndicator();

    const formData = new FormData();
    formData.append('audio', audioBlob, 'voice_message.webm');

    try {
        const response = await fetch('/api/voice-chat', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        hideTypingIndicator();

        if (data.transcribed_text) {
            addMessage(data.transcribed_text, 'user');
        }

        if (data.expense_analysis) {
            showExpenseAnalysis(data.expense_analysis);
        }

        addMessage(data.response, 'bot');
    } catch (error) {
        hideTypingIndicator();
        console.error('Voice message error:', error);
        addMessage('Ошибка обработки голосового сообщения. Попробуйте еще раз или используйте текст.', 'bot');
    }
}
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.innerHTML = '🎤';

                // Остановка всех треков
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }

        async function sendVoiceMessage(audioBlob) {
            showTypingIndicator();

            const formData = new FormData();
            formData.append('audio', audioBlob);

            try {
                const response = await fetch('/api/voice-chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                hideTypingIndicator();

                if (data.transcribed_text) {
                    addMessage(data.transcribed_text, 'user');
                }

                if (data.expense_analysis) {
                    showExpenseAnalysis(data.expense_analysis);
                }

                addMessage(data.response, 'bot');
            } catch (error) {
                hideTypingIndicator();
                addMessage('Ошибка обработки голосового сообщения', 'bot');
            }
        }

        // Вспомогательные функции
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = text.replace(/\n/g, '<br>');

            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';

            const bubble = document.createElement('div');
            bubble.className = 'typing-indicator';
            bubble.style.display = 'block';

            const dots = document.createElement('div');
            dots.className = 'typing-dots';
            dots.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            bubble.appendChild(dots);
            typingDiv.appendChild(bubble);
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        function showExpenseAnalysis(analysis) {
            const analysisDiv = document.createElement('div');
            analysisDiv.className = 'expense-analysis';

            let html = `<strong>Анализ ваших расходов:</strong><br>`;
            html += `• Общие расходы: ${analysis.total_expenses.toLocaleString()} тенге/месяц<br>`;
            html += `• Норма сбережений: ${analysis.savings_rate.toFixed(1)}%<br>`;

            if (analysis.recommendations.length > 0) {
                html += `<strong>Рекомендации:</strong><br>`;
                analysis.recommendations.forEach(rec => {
                    html += `• ${rec}<br>`;
                });
            }

            analysisDiv.innerHTML = html;
            chatContainer.appendChild(analysisDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendQuickMessage(message) {
            messageInput.value = message;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Обработчики событий
        sendBtn.addEventListener('click', sendMessage);
    </script>
</body>
</html>
